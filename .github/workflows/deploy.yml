name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.atl' \
            --exclude 'docs' --exclude '_site' \
            ./ _site/
          # GitHub Pages serves index.html; fall back to index.v2.html
          if [ ! -f _site/index.html ] && [ -f _site/index.v2.html ]; then
            cp _site/index.v2.html _site/index.html
          fi
          # The v2 source is not published; index.html is the served copy
          rm -f _site/index.v2.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
