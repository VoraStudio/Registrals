name: Deploy to Production

on:
  push:
    branches: [ main, f-symfony ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "Iniciant desplegament a producció (Registrals)..."
            cd /opt/registrals/app
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            COMPOSE_FILE="/opt/registrals/app/docker/prod/docker-compose.yml"
            docker compose -f "$COMPOSE_FILE" exec -T php composer install --no-dev --optimize-autoloader --no-interaction
            docker compose -f "$COMPOSE_FILE" exec -T php chmod +x /var/www/registrals/bin/console
            docker compose -f "$COMPOSE_FILE" exec -T php php bin/console doctrine:migrations:migrate --no-interaction
            docker compose -f "$COMPOSE_FILE" exec -T php php bin/console tailwind:build --minify
            docker compose -f "$COMPOSE_FILE" exec -T php php bin/console asset-map:compile
            docker compose -f "$COMPOSE_FILE" exec -T php php bin/console cache:clear --env=prod
            docker compose -f "$COMPOSE_FILE" exec -T php php bin/console cache:warmup --env=prod
            docker compose -f "$COMPOSE_FILE" exec -T php chown -R www-data:www-data /var/www/registrals/var /var/www/registrals/web/assets /var/www/registrals/web/uploads
            docker compose -f "$COMPOSE_FILE" exec -T php chmod -R 775 /var/www/registrals/var /var/www/registrals/web/assets /var/www/registrals/web/uploads
            docker compose -f "$COMPOSE_FILE" restart worker
            echo "Desplegament completat amb èxit!"
