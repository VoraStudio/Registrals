# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(AI_ASSISTANCE_ENABLED): 'true'
    env(MAILER_FROM_ADDRESS): 'info@registrals.com'
    env(MAILER_FROM_NAME): 'Registrals'
    app.ai_assistance_enabled: '%env(bool:AI_ASSISTANCE_ENABLED)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailerFromAddress: '%env(string:MAILER_FROM_ADDRESS)%'
            string $mailerFromName: '%env(string:MAILER_FROM_NAME)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Security\EmailOtpService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\EventSubscriber\VisitTelemetrySubscriber:
        arguments:
            $appSecret: '%kernel.secret%'
            $environment: '%kernel.environment%'

    App\Service\OAuth\GoogleOAuthService:
        arguments:
            $clientId: '%env(string:OAUTH_GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(string:OAUTH_GOOGLE_CLIENT_SECRET)%'

    App\Infrastructure\Adapter\Blockchain\BlockchainAnchorInterface: '@App\Infrastructure\Adapter\Blockchain\PolygonAnchorClient'

    App\Infrastructure\Adapter\Blockchain\PolygonAnchorClient:
        arguments:
            $rpcUrl: '%env(string:BLOCKCHAIN_RPC_URL)%'
            $contractAddress: '%env(string:BLOCKCHAIN_CONTRACT_ADDRESS)%'
            $walletPrivateKey: '%env(string:default::BLOCKCHAIN_HOT_WALLET_PRIVATE_KEY)%'
            $network: '%env(string:BLOCKCHAIN_NETWORK)%'

    App\Service\Certificate\PdfRendererService:
        arguments:
            $configuredBinary: '%env(default::string:CHROMIUM_BINARY_PATH)%'

    App\Infrastructure\Adapter\Signature\SignaturitTimestampInterface: '@App\Infrastructure\Adapter\Signature\SignaturitClient'

    App\Infrastructure\Adapter\Signature\SignaturitClient:
        arguments:
            $apiToken: '%env(default::string:SIGNATURIT_API_TOKEN)%'
            $baseUrl: '%env(string:SIGNATURIT_BASE_URL)%'

    App\Infrastructure\Adapter\Payment\PaymentGatewayInterface: '@App\Infrastructure\Adapter\Payment\StripeGatewayClient'

    App\Infrastructure\Adapter\Payment\StripeGatewayClient:
        arguments:
            $secretKey: '%env(default::string:STRIPE_SECRET_KEY)%'
            $webhookSecret: '%env(default::string:STRIPE_WEBHOOK_SECRET)%'
            $pricePlusId: '%env(default::string:STRIPE_PRICE_PLUS)%'
            $priceUnlimitedId: '%env(default::string:STRIPE_PRICE_UNLIMITED)%'



